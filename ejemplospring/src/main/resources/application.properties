spring.application.name=ejemplospring

# ─── Puerto del servidor ─────────────────────────────────────────────────────
server.port=8081

# ─── MySQL DataSource ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ejemplospring_bd?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── HikariCP Connection Pool ───────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ─── Multipart / File Upload ────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Uploads directory (configurable) ──────────────────────────────────────
app.uploads.dir=uploads

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.org.springframework.jdbc=DEBUG
