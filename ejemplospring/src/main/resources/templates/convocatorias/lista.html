<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | App'">Convocatorias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { background: linear-gradient(180deg,#1a1a2e,#16213e); min-height: 100vh; width: 240px; padding: 20px 12px; }
        .sidebar-link { color: rgba(255,255,255,.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 8px; transition: .2s; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,.12); color: white; }
        .main-content { flex: 1; padding: 30px; }
        .layout { display: flex; min-height: 100vh; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .table thead th { background-color: #1a1a2e; color: white; border: none; }
        .filter-card { background: white; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    </style>
</head>
<body>
<div class="layout">
    <nav class="sidebar d-flex flex-column gap-1">
        <div class="text-white fw-bold fs-5 mb-4 px-2">
            <i class="bi bi-grid-fill me-2 text-primary"></i>Beneficios App
        </div>
        <a href="/web/beneficios" class="sidebar-link">
            <i class="bi bi-gift me-2"></i>Beneficios
        </a>
        <a href="/web/convocatorias" class="sidebar-link active">
            <i class="bi bi-megaphone me-2"></i>Convocatorias
        </a>
        <hr class="border-secondary my-2"/>
        <a href="/web/beneficios/nuevo" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Beneficio
        </a>
        <a href="/web/convocatorias/nueva" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nueva Convocatoria
        </a>
    </nav>

    <div class="main-content">

        <!-- Flash -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-0"><i class="bi bi-megaphone me-2 text-primary"></i>Convocatorias</h4>
                <small class="text-muted">Gestión de convocatorias activas e inactivas</small>
            </div>
            <a href="/web/convocatorias/nueva" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>Nueva Convocatoria
            </a>
        </div>

        <!-- Filtros -->
        <div class="filter-card">
            <form th:action="@{/web/convocatorias/filtrar}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold mb-1">Estado</label>
                    <select name="estado" class="form-select form-select-sm">
                        <option value="">-- Todos --</option>
                        <option value="Activa"   th:selected="${estadoSeleccionado == 'Activa'}">Activa</option>
                        <option value="Inactiva" th:selected="${estadoSeleccionado == 'Inactiva'}">Inactiva</option>
                        <option value="Cerrada"  th:selected="${estadoSeleccionado == 'Cerrada'}">Cerrada</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold mb-1">Categoría (opcional)</label>
                    <input type="text" name="categoria" class="form-control form-control-sm"
                           placeholder="Ej: Vivienda" th:value="${categoriaFiltro}"/>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-sm btn-outline-primary w-100">
                        <i class="bi bi-funnel me-1"></i>Filtrar
                    </button>
                </div>
                <div class="col-md-2">
                    <a href="/web/convocatorias" class="btn btn-sm btn-outline-secondary w-100">
                        <i class="bi bi-x me-1"></i>Limpiar
                    </a>
                </div>
            </form>
        </div>

        <!-- Tabla -->
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead>
                        <tr>
                            <th class="ps-3">#</th>
                            <th>Nombre</th>
                            <th>Beneficio</th>
                            <th>Fechas</th>
                            <th>Cupos</th>
                            <th>Valor Pago</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(convocatorias)}">
                            <td colspan="8" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                No hay convocatorias registradas
                            </td>
                        </tr>
                        <tr th:each="c : ${convocatorias}">
                            <td class="ps-3 text-muted" th:text="${c.idConvocatoria}"></td>
                            <td class="fw-semibold" th:text="${c.nombre}"></td>
                            <td>
                                <span class="badge bg-secondary" th:text="${c.nombreBeneficio}"></span>
                            </td>
                            <td class="small text-muted">
                                <div th:text="${#temporals.format(c.fechaInicio, 'dd/MM/yyyy')}"></div>
                                <div class="text-danger" th:text="'→ ' + ${#temporals.format(c.fechaCierre, 'dd/MM/yyyy')}"></div>
                            </td>
                            <td th:text="${c.cupos}"></td>
                            <td th:text="${'$ ' + #numbers.formatDecimal(c.valorPago, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td>
                                <span th:switch="${c.estado}">
                                    <span th:case="'Activa'"   class="badge bg-primary">Activa</span>
                                    <span th:case="'Inactiva'" class="badge bg-secondary">Inactiva</span>
                                    <span th:case="'Cerrada'"  class="badge bg-danger">Cerrada</span>
                                </span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/web/convocatorias/{id}(id=${c.idConvocatoria})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
