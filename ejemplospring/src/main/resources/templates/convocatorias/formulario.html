<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | App'">Nueva Convocatoria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { background: linear-gradient(180deg,#1a1a2e,#16213e); min-height: 100vh; width: 240px; padding: 20px 12px; }
        .sidebar-link { color: rgba(255,255,255,.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 8px; transition: .2s; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,.12); color: white; }
        .main-content { flex: 1; padding: 30px; }
        .layout { display: flex; min-height: 100vh; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .form-control:focus, .form-select:focus { border-color: #0d6efd; box-shadow: 0 0 0 .2rem rgba(13,110,253,.15); }
    </style>
</head>
<body>
<div class="layout">
    <nav class="sidebar d-flex flex-column gap-1">
        <div class="text-white fw-bold fs-5 mb-4 px-2">
            <i class="bi bi-grid-fill me-2 text-primary"></i>Beneficios App
        </div>
        <a href="/web/beneficios" class="sidebar-link">
            <i class="bi bi-gift me-2"></i>Beneficios
        </a>
        <a href="/web/convocatorias" class="sidebar-link active">
            <i class="bi bi-megaphone me-2"></i>Convocatorias
        </a>
        <hr class="border-secondary my-2"/>
        <a href="/web/beneficios/nuevo" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Beneficio
        </a>
        <a href="/web/convocatorias/nueva" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nueva Convocatoria
        </a>
    </nav>

    <div class="main-content">

        <div class="mb-4">
            <a href="/web/convocatorias" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i>Volver a la lista
            </a>
            <h4 class="fw-bold mt-2 mb-0">
                <i class="bi bi-megaphone me-2 text-primary"></i>
                <span th:text="${titulo}">Nueva Convocatoria</span>
            </h4>
        </div>

        <!-- Error regla de negocio -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white py-3">
                <h6 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Datos de la Convocatoria</h6>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/web/convocatorias/nueva}" th:object="${convocatoria}" method="post">

                    <!-- Beneficio padre -->
                    <div class="mb-3">
                        <label for="idBeneficio" class="form-label fw-semibold">
                            Beneficio <span class="text-danger">*</span>
                        </label>
                        <select id="idBeneficio" th:field="*{idBeneficio}"
                                class="form-select" th:classappend="${#fields.hasErrors('idBeneficio')} ? 'is-invalid'">
                            <option value="">-- Selecciona un beneficio activo --</option>
                            <option th:each="b : ${beneficios}"
                                    th:value="${b.idBeneficio}"
                                    th:text="${b.nombre} + ' (' + ${b.categoria} + ')'">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('idBeneficio')}"
                             th:errors="*{idBeneficio}"></div>
                    </div>

                    <!-- Nombre -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold">
                            Nombre de la Convocatoria <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="nombre" th:field="*{nombre}"
                               class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                               placeholder="Ej: Convocatoria Q1-2027" maxlength="150"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                             th:errors="*{nombre}"></div>
                    </div>

                    <!-- Fechas -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fechaInicio" class="form-label fw-semibold">
                                Fecha Inicio <span class="text-danger">*</span>
                            </label>
                            <input type="date" id="fechaInicio" th:field="*{fechaInicio}"
                                   class="form-control" th:classappend="${#fields.hasErrors('fechaInicio')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaInicio')}"
                                 th:errors="*{fechaInicio}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="fechaCierre" class="form-label fw-semibold">
                                Fecha Cierre <span class="text-danger">*</span>
                            </label>
                            <input type="date" id="fechaCierre" th:field="*{fechaCierre}"
                                   class="form-control" th:classappend="${#fields.hasErrors('fechaCierre')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaCierre')}"
                                 th:errors="*{fechaCierre}"></div>
                        </div>
                    </div>

                    <!-- Cupos, Valor y Estado -->
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="cupos" class="form-label fw-semibold">
                                Cupos <span class="text-danger">*</span>
                            </label>
                            <input type="number" id="cupos" th:field="*{cupos}" min="1"
                                   class="form-control" th:classappend="${#fields.hasErrors('cupos')} ? 'is-invalid'"
                                   placeholder="Mínimo 1"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('cupos')}"
                                 th:errors="*{cupos}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="valorPago" class="form-label fw-semibold">
                                Valor de Pago <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" id="valorPago" th:field="*{valorPago}"
                                       step="0.01" min="0.01"
                                       class="form-control" th:classappend="${#fields.hasErrors('valorPago')} ? 'is-invalid'"
                                       placeholder="0.00"/>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('valorPago')}"
                                 th:errors="*{valorPago}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="estado" class="form-label fw-semibold">Estado</label>
                            <select id="estado" th:field="*{estado}" class="form-select">
                                <option value="Inactiva">Inactiva</option>
                                <option value="Activa">Activa</option>
                                <option value="Cerrada">Cerrada</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-4"/>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-2"></i>Guardar Convocatoria
                        </button>
                        <a href="/web/convocatorias" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-x-lg me-2"></i>Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
