<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | App'">Detalle Convocatoria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { background: linear-gradient(180deg,#1a1a2e,#16213e); min-height: 100vh; width: 240px; padding: 20px 12px; }
        .sidebar-link { color: rgba(255,255,255,.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 8px; transition: .2s; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,.12); color: white; }
        .main-content { flex: 1; padding: 30px; }
        .layout { display: flex; min-height: 100vh; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .info-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; font-weight: 600; }
        .info-value { font-size: 1rem; color: #212529; margin-top: 2px; }
        .stat-card { background: white; border-radius: 10px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    </style>
</head>
<body>
<div class="layout">
    <nav class="sidebar d-flex flex-column gap-1">
        <div class="text-white fw-bold fs-5 mb-4 px-2">
            <i class="bi bi-grid-fill me-2 text-primary"></i>Beneficios App
        </div>
        <a href="/web/beneficios" class="sidebar-link">
            <i class="bi bi-gift me-2"></i>Beneficios
        </a>
        <a href="/web/convocatorias" class="sidebar-link active">
            <i class="bi bi-megaphone me-2"></i>Convocatorias
        </a>
        <hr class="border-secondary my-2"/>
        <a href="/web/beneficios/nuevo" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Beneficio
        </a>
        <a href="/web/convocatorias/nueva" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nueva Convocatoria
        </a>
    </nav>

    <div class="main-content">
        <div class="mb-4">
            <a href="/web/convocatorias" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i>Volver a la lista
            </a>
            <h4 class="fw-bold mt-2 mb-0">
                <i class="bi bi-megaphone me-2 text-primary"></i>Detalle de la Convocatoria
            </h4>
        </div>

        <!-- Stats rápidos -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <div class="text-muted small">Cupos</div>
                    <div class="fs-3 fw-bold text-primary" th:text="${convocatoria.cupos}"></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <div class="text-muted small">Valor de Pago</div>
                    <div class="fs-5 fw-bold text-success"
                         th:text="${'$ ' + #numbers.formatDecimal(convocatoria.valorPago, 1, 'COMMA', 2, 'POINT')}"></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <div class="text-muted small">Estado</div>
                    <div class="mt-1">
                        <span th:switch="${convocatoria.estado}">
                            <span th:case="'Activa'"   class="badge bg-primary fs-6">Activa</span>
                            <span th:case="'Inactiva'" class="badge bg-secondary fs-6">Inactiva</span>
                            <span th:case="'Cerrada'"  class="badge bg-danger fs-6">Cerrada</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <div class="text-muted small">Beneficio</div>
                    <div class="fw-semibold small mt-1" th:text="${convocatoria.nombreBeneficio}"></div>
                </div>
            </div>
        </div>

        <!-- Detalle completo -->
        <div class="card">
            <div class="card-header bg-primary text-white py-3">
                <h6 class="mb-0" th:text="${convocatoria.nombre}"></h6>
            </div>
            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="info-label">ID Convocatoria</div>
                        <div class="info-value" th:text="${convocatoria.idConvocatoria}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-label">Beneficio Asociado</div>
                        <div class="info-value">
                            <span class="badge bg-secondary fs-6" th:text="${convocatoria.nombreBeneficio}"></span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-label">Fecha de Inicio</div>
                        <div class="info-value"
                             th:text="${#temporals.format(convocatoria.fechaInicio, 'dd/MM/yyyy')}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-label">Fecha de Cierre</div>
                        <div class="info-value text-danger"
                             th:text="${#temporals.format(convocatoria.fechaCierre, 'dd/MM/yyyy')}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-label">Fecha de Creación</div>
                        <div class="info-value"
                             th:text="${#temporals.format(convocatoria.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
