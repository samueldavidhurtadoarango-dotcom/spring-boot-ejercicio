<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | App'">Lista de Beneficios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { background: linear-gradient(180deg,#1a1a2e,#16213e); min-height: 100vh; width: 240px; padding: 20px 12px; }
        .sidebar-link { color: rgba(255,255,255,.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 8px; transition: .2s; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,.12); color: white; }
        .main-content { flex: 1; padding: 30px; }
        .layout { display: flex; min-height: 100vh; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .table thead th { background-color: #1a1a2e; color: white; border: none; }
    </style>
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <nav class="sidebar d-flex flex-column gap-1">
        <div class="text-white fw-bold fs-5 mb-4 px-2">
            <i class="bi bi-grid-fill me-2 text-primary"></i>Beneficios App
        </div>
        <a href="/web/beneficios" class="sidebar-link active">
            <i class="bi bi-gift me-2"></i>Beneficios
        </a>
        <a href="/web/convocatorias" class="sidebar-link">
            <i class="bi bi-megaphone me-2"></i>Convocatorias
        </a>
        <hr class="border-secondary my-2"/>
        <a href="/web/beneficios/nuevo" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Beneficio
        </a>
        <a href="/web/convocatorias/nueva" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nueva Convocatoria
        </a>
    </nav>

    <!-- Main -->
    <div class="main-content">

        <!-- Flash -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-0"><i class="bi bi-gift me-2 text-primary"></i>Beneficios</h4>
                <small class="text-muted">Gestión de beneficios registrados</small>
            </div>
            <a href="/web/beneficios/nuevo" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>Nuevo Beneficio
            </a>
        </div>

        <!-- Tabla -->
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead>
                        <tr>
                            <th class="ps-3">#</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Estado</th>
                            <th>Fecha Creación</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(beneficios)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                No hay beneficios registrados
                            </td>
                        </tr>
                        <tr th:each="b : ${beneficios}">
                            <td class="ps-3 text-muted" th:text="${b.idBeneficio}"></td>
                            <td class="fw-semibold" th:text="${b.nombre}"></td>
                            <td>
                                <span class="badge bg-secondary" th:text="${b.categoria}"></span>
                            </td>
                            <td>
                                <span th:if="${b.estado == 'Activo'}"
                                      class="badge bg-success">Activo</span>
                                <span th:if="${b.estado != 'Activo'}"
                                      class="badge bg-secondary">Inactivo</span>
                            </td>
                            <td class="text-muted small"
                                th:text="${#temporals.format(b.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-center">
                                <a th:href="@{/web/beneficios/{id}(id=${b.idBeneficio})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
