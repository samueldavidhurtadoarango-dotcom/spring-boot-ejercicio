<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | App'">Nuevo Beneficio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { background: linear-gradient(180deg,#1a1a2e,#16213e); min-height: 100vh; width: 240px; padding: 20px 12px; }
        .sidebar-link { color: rgba(255,255,255,.75); text-decoration: none; display: block; padding: 10px 16px; border-radius: 8px; transition: .2s; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,.12); color: white; }
        .main-content { flex: 1; padding: 30px; }
        .layout { display: flex; min-height: 100vh; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .form-control:focus, .form-select:focus { border-color: #0d6efd; box-shadow: 0 0 0 .2rem rgba(13,110,253,.15); }
    </style>
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <nav class="sidebar d-flex flex-column gap-1">
        <div class="text-white fw-bold fs-5 mb-4 px-2">
            <i class="bi bi-grid-fill me-2 text-primary"></i>Beneficios App
        </div>
        <a href="/web/beneficios" class="sidebar-link active">
            <i class="bi bi-gift me-2"></i>Beneficios
        </a>
        <a href="/web/convocatorias" class="sidebar-link">
            <i class="bi bi-megaphone me-2"></i>Convocatorias
        </a>
        <hr class="border-secondary my-2"/>
        <a href="/web/beneficios/nuevo" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Beneficio
        </a>
        <a href="/web/convocatorias/nueva" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>Nueva Convocatoria
        </a>
    </nav>

    <!-- Main -->
    <div class="main-content">

        <!-- Header -->
        <div class="mb-4">
            <a href="/web/beneficios" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i>Volver a la lista
            </a>
            <h4 class="fw-bold mt-2 mb-0">
                <i class="bi bi-gift me-2 text-primary"></i>
                <span th:text="${titulo}">Nuevo Beneficio</span>
            </h4>
        </div>

        <!-- Error de regla de negocio -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Formulario -->
        <div class="card">
            <div class="card-header bg-primary text-white py-3">
                <h6 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Datos del Beneficio</h6>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/web/beneficios/nuevo}" th:object="${beneficio}" method="post">

                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold">
                            Nombre <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="nombre" th:field="*{nombre}"
                               class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                               placeholder="Ej: Subsidio de Vivienda" maxlength="150"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                             th:errors="*{nombre}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-semibold">
                            Descripción <span class="text-danger">*</span>
                        </label>
                        <textarea id="descripcion" th:field="*{descripcion}" rows="4"
                                  class="form-control" th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"
                                  placeholder="Describe el beneficio..."></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}"
                             th:errors="*{descripcion}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="categoria" class="form-label fw-semibold">
                                Categoría <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="categoria" th:field="*{categoria}"
                                   class="form-control" th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'"
                                   placeholder="Ej: Vivienda, Educación, Salud" maxlength="100"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoria')}"
                                 th:errors="*{categoria}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="estado" class="form-label fw-semibold">Estado</label>
                            <select id="estado" th:field="*{estado}" class="form-select">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-4"/>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-2"></i>Guardar Beneficio
                        </button>
                        <a href="/web/beneficios" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-x-lg me-2"></i>Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
